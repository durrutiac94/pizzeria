<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>L'impasto di César - Contacto</title>
  <meta name="description" content="Contacta a L'impasto di César: escríbenos para pedidos, reservas y consultas sobre nuestras pizzas tradicionales.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/variables.css" rel="stylesheet">
  <link href="/css/base.css" rel="stylesheet">
  <link href="/css/layout.css" rel="stylesheet">
  <link href="/css/components.css" rel="stylesheet">
</head>
<body style="color: var(--color-text); background-color: var(--color-background); font-family: var(--font-family-sans);">
  <a class="visually-hidden-focusable" href="#contenido">Saltar al contenido principal</a>

  <header class="sticky-top">
    <nav class="navbar py-2" style="background-color: var(--color-primary);" aria-label="Navegación principal">
      <div class="container d-flex justify-content-between align-items-center">
        <a class="navbar-brand d-flex align-items-center gap-2 text-decoration-none" href="index.html">
          <img src="assets/img/logo-tienda.jpg" alt="Logotipo de L'impasto di César" width="280" height="80" class="rounded">
        </a>
        <ul class="navbar-nav d-flex flex-row gap-4 flex-nowrap align-items-center mb-0">
          <li class="nav-item">
            <a class="nav-link text-uppercase" href="index.html" style="color: var(--color-white); font-size: var(--font-size-2xl);"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nav-icon me-1" style="width:1em;height:1em" aria-hidden="true" focusable="false"><path d="M3 9l9-6 9 6v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><path d="M9 21v-8h6v8"></path></svg>Inicio</a>
          </li>
          <li class="nav-item">
            <a class="nav-link text-uppercase" href="catalogo.html" style="color: var(--color-white); font-size: var(--font-size-2xl);"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nav-icon me-1" style="width:1em;height:1em" aria-hidden="true" focusable="false"><path d="M12 21 3 4a17 17 0 0 1 18 0z"></path><path d="M8.5 11h.01"></path><path d="M12 13.5h.01"></path><path d="M15.5 9.5h.01"></path></svg>Menú</a>
          </li>
          <li class="nav-item">
            <a class="nav-link text-uppercase" href="nosotros.html" style="color: var(--color-white); font-size: var(--font-size-2xl);"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nav-icon me-1" style="width:1em;height:1em" aria-hidden="true" focusable="false"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>Nosotros</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active text-uppercase" href="contacto.html" aria-current="page" style="color: var(--color-white); font-size: var(--font-size-2xl);"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nav-icon me-1" style="width:1em;height:1em" aria-hidden="true" focusable="false"><path d="M4 6h16a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2z"></path><path d="M2 9l10 6 10-6"></path></svg>Contacto</a>
          </li>
        </ul>
      </div>
    </nav>
  </header>

  <main class="container my-5" id="contenido">
    <h1 class="text-center mb-4" style="color: var(--color-primary);">Contáctanos</h1>

    <div class="row">
      <div class="col-md-8 mx-auto">
        <div class="card shadow-sm" style="border-color: var(--color-border);">
          <div class="card-body p-4">
            <form id="contactoForm" class="row g-3" action="https://formspree.io/f/xeaekqge" method="POST" novalidate>
              <input type="hidden" name="_subject" value="Nuevo mensaje desde contacto">
              <input type="text" name="_gotcha" class="d-none" tabindex="-1" autocomplete="off" aria-hidden="true">
              <div class="col-md-6">
                <label for="inputNombre" class="form-label" style="color: var(--color-text);">Nombre Completo</label>
                <input type="text" class="form-control" id="inputNombre" name="nombre" autocomplete="name" required aria-required="true" aria-describedby="errorNombre">
                <div id="errorNombre" class="invalid-feedback"></div>
              </div>
              <div class="col-md-6">
                <label for="inputEmail" class="form-label" style="color: var(--color-text);">Correo Electrónico</label>
                <input type="email" class="form-control" id="inputEmail" name="email" autocomplete="email" required aria-required="true" aria-describedby="errorEmail">
                <div id="errorEmail" class="invalid-feedback"></div>
              </div>
              <div class="col-12">
                <label for="selectAsunto" class="form-label" style="color: var(--color-text);">Asunto</label>
                <select class="form-select" id="selectAsunto" name="asunto" required aria-required="true" aria-describedby="errorAsunto">
                  <option value="" selected disabled>Selecciona un asunto</option>
                  <option value="consulta">Consulta general</option>
                  <option value="pedido">Pedido o reserva</option>
                  <option value="sugerencia">Sugerencia</option>
                </select>
                <div id="errorAsunto" class="invalid-feedback"></div>
              </div>
              <div class="col-12">
                <label for="inputMensaje" class="form-label" style="color: var(--color-text);">Mensaje</label>
                <textarea class="form-control" id="inputMensaje" name="mensaje" rows="5" required aria-required="true" aria-describedby="errorMensaje"></textarea>
                <div id="errorMensaje" class="invalid-feedback"></div>
              </div>
              <div class="col-12">
                <button type="submit" id="btnEnviar" class="btn btn-primary px-4" style="background-color: var(--color-primary); border-color: var(--color-primary);">
                  <span class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                  Enviar Mensaje
                </button>
              </div>
              <div id="alertaExito" class="alert alert-success d-none" role="alert">Mensaje enviado con éxito.</div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="py-4 text-center" style="background-color: var(--color-neutral-900);">
    <address class="mb-1" style="color: var(--color-neutral-300); font-style: normal;">CARRERA 55B #76-06, Barrio Jorge Eliecer Gaitán, Bogotá</address>
    <p class="mb-0" style="color: var(--color-white);">&copy; 2026 L'impasto di César. Todos los derechos reservados.</p>
  </footer>
</body>
</html>
